# Keep the DBGMCU clock running during low-power sleep modes
CONFIG_STM32_ENABLE_DEBUG_SLEEP_STOP=y

# Forces the CPU to keep JTAG/SWD pins allocated for debugging
CONFIG_DEBUG=y

# Essential Low-Level Hardware Drivers
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Base File System & Storage Layers
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FS_LITTLEFS_NUM_FILES=4

# Base Utilities that MCUmgr needs to unlock NET_BUF and ZCBOR
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_CRC=y

# Classic USB Device Stack Setup
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y

# Core MCUmgr Subsystem
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=8192
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_FS=y
CONFIG_MCUMGR_GRP_SHELL=y
CONFIG_MCUMGR_GRP_SETTINGS=y
CONFIG_MCUMGR_GRP_FS_FILE_ACCESS_HOOK=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y

# Core Utilities required by MCUmgr
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_CRC=y

CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

#CONFIG_NEWLIB_LIBC=y
CONFIG_PICOLIBC=y

# Lua stack management
CONFIG_STACK_SENTINEL=n
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
# MPU-backed stack overflow protection: faults immediately on overflow with the
# offending thread in the fault dump (vs. STACK_SENTINEL which only checks at
# context switch). Requires an MPU (present on the STM32 Cortex-M).
CONFIG_ARM_MPU=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=n
CONFIG_THREAD_ANALYZER_USE_PRINTK=y

# Enable Serial
CONFIG_SERIAL=y
CONFIG_UART_STM32=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Console over USART2 (ST-Link VCP)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Logging via UART backend
CONFIG_PRINTK=y
CONFIG_I2C_LOG_LEVEL_DBG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=2048

# Useful during bring-up: include board name in logs and keep asserts on
CONFIG_ASSERT=y

CONFIG_LED=y
CONFIG_LED_GPIO=y

CONFIG_I2C=y
CONFIG_PWM=y
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_PWM=y
CONFIG_GPIO_TCA6424A=y

# Core Flash and Storage support
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y

# Enable LittleFS
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y

# Enable POSIX
CONFIG_POSIX_API=y

# Enable NVS
CONFIG_NVS=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# Modbus support
CONFIG_MODBUS=y
CONFIG_MODBUS_ROLE_SERVER=y
CONFIG_MODBUS_SERIAL=y

# Debugging flags
#CONFIG_I2C_LOG_LEVEL_DBG=n
#CONFIG_GPIO_LOG_LEVEL_DBG=n
#CONFIG_SPI_LOG_LEVEL_DBG=n
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y

# Optimzations
CONFIG_LOG=y
# CONFIG_LINKER_ORPHAN_SECTION_WARN=y
# CONFIG_CBPRINTF_NANO=y
# CONFIG_BOOT_BANNER=n
